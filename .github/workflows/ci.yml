name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - name: Verify production install
        run: |
          rm -rf node_modules
          npm ci --omit=dev
          node dist-server/server.js &
          sleep 3
          curl -sf http://localhost:3000/ > /dev/null
          kill %1
