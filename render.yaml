# Render blueprint for the persistent server.
#
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
#
# After first deploy, set the secrets below in:
#   Dashboard → zacharywalkermusic → Environment
# Then Manual Deploy so they take effect.
#
# Required for newsletter / booking / contact:
#   SUPABASE_SERVICE_ROLE_KEY  = service_role secret from Supabase
# Optional for welcome emails:
#   GMAIL_APP_PASSWORD
#   ADMIN_SECRET

services:
  - type: web
    name: zacharywalkermusic
    runtime: node
    plan: starter # Free instances sleep when idle — defeats a persistent server.
    region: ohio
    branch: main

    # --include=dev is required: NODE_ENV=production is set below, and npm omits
    # devDependencies when it sees that. The build tooling (Vite, esbuild,
    # TypeScript) lives in devDependencies, so a bare `npm ci` here installs
    # none of it and the build fails.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start

    healthCheckPath: /healthz

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"

      # Public project URL — safe to commit. With or without /rest/v1.
      - key: SUPABASE_URL
        value: https://fsxcqohqvuvapbmfcvnu.supabase.co

      # REQUIRED secret. Supabase → Project Settings → API → service_role.
      # Do NOT put the anon key here or the newsletter will fail.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Outbound email. Optional: signups still save without these.
      - key: GMAIL_USER
        value: mgmt@zacharywalkermusic.com
      - key: GMAIL_APP_PASSWORD
        sync: false

      # Bearer token guarding POST /api/welcome-email.
      - key: ADMIN_SECRET
        sync: false
